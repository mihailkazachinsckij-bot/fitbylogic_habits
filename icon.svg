<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background: deep navy → dark indigo -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d0d1f"/>
      <stop offset="100%" stop-color="#130828"/>
    </linearGradient>
    <!-- Subtle radial glow in center -->
    <radialGradient id="glow" cx="50%" cy="46%" r="44%">
      <stop offset="0%" stop-color="#1a4fff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#007aff" stop-opacity="0"/>
    </radialGradient>
    <!-- Arc gradient: blue → purple -->
    <linearGradient id="arcGrad" x1="512" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34aaff"/>
      <stop offset="55%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
    <!-- Glow filter for the arc -->
    <filter id="arcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Soft shadow for checkmark -->
    <filter id="ckShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" in="SourceAlpha" result="blur"/>
      <feFlood flood-color="#007aff" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="114" fill="url(#bg)"/>
  <!-- Center glow overlay -->
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <!-- Very subtle inner border -->
  <rect x="1" y="1" width="510" height="510" rx="113"
    fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- ─── Progress ring ─── -->
  <!-- Track (dim white) -->
  <circle cx="256" cy="212" r="118"
    fill="none"
    stroke="rgba(255,255,255,0.08)"
    stroke-width="17"/>

  <!-- Arc fill: ~290° of 360° (≈80%) -->
  <!-- circumference = 2π×118 ≈ 741.4 -->
  <!-- dashoffset for ~80% fill = 741.4 × 0.195 ≈ 144.6  (gap = ~20%) -->
  <!-- Rotate so gap sits in bottom-right -->
  <circle cx="256" cy="212" r="118"
    fill="none"
    stroke="url(#arcGrad)"
    stroke-width="17"
    stroke-linecap="round"
    stroke-dasharray="741.4"
    stroke-dashoffset="144.6"
    transform="rotate(-90 256 212)"
    filter="url(#arcGlow)"/>

  <!-- Bright dot at arc end (achievement spark) -->
  <!-- x = 256 + 118×cos(200°) ≈ 145 -->
  <!-- y = 212 + 118×sin(200°) ≈ 212 - 40.4 ≈ 172 -->
  <circle cx="145" cy="172" r="9" fill="#34aaff" opacity="0.9"/>
  <circle cx="145" cy="172" r="5" fill="white"/>

  <!-- ─── Checkmark ─── -->
  <path d="M193 210 l45 45 88 -90"
    fill="none"
    stroke="white"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#ckShadow)"/>

  <!-- ─── Wordmark ─── -->
  <text x="256" y="398"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="44" font-weight="800" fill="white" opacity="0.9"
    text-anchor="middle" letter-spacing="3">FITBYLOGIC</text>
  <text x="256" y="435"
    font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
    font-size="21" font-weight="400" fill="white" opacity="0.38"
    text-anchor="middle" letter-spacing="9">HABITS</text>
</svg>
